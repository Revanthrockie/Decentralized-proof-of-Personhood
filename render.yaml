# Render "Blueprint" — lets you deploy the backend with one click via
# Render's dashboard: New + -> Blueprint -> pick this repo.
# (Doesn't touch the frontend — that goes to Vercel separately, see
# DEPLOYMENT.md.)
services:
  - type: web
    name: proof-of-personhood-backend
    runtime: python
    plan: free
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /
    envVars:
      - key: PINATA_API_KEY
        sync: false
      - key: PINATA_SECRET_API_KEY
        sync: false
      - key: RPC_URL
        value: https://rpc-amoy.polygon.technology/
      - key: MINTER_PRIVATE_KEY
        sync: false
      - key: CONTRACT_ADDRESS
        sync: false
      - key: ENABLE_FACE_DEDUP
        value: "true"
      - key: FACE_MATCH_THRESHOLD
        value: "0.93"
      - key: AUDIO_MATCH_THRESHOLD
        value: "0.65"
      - key: ALLOW_DEMO_RESET
        value: "false"
      - key: ALLOWED_ORIGINS
        sync: false  # set to your Vercel URL, e.g. https://your-app.vercel.app
